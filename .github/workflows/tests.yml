name: Skill contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run portable contract tests
        run: python -m unittest discover -s tests -v
      - name: Compile tests without dependencies
        run: python -m py_compile tests/test_skill_contract.py
